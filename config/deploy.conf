# ==================== VIP 配置 (Keepalived 高可用) ====================
# 配置 VIP 后，FreeSWITCH 的 domain / rtp-ip / sip-ip 将绑定到 VIP 地址:
#   fs/conf/vars.xml                     -> domain, domain_name
#   fs/conf/sip_profiles/external.xml    -> rtp-ip, sip-ip, ext-rtp-ip, ext-sip-ip
#   fs/conf/sip_profiles/internal.xml    -> rtp-ip, sip-ip, ext-rtp-ip, ext-sip-ip
# 留空 = 不使用 VIP (单机部署)，跳过以上修改
VIP=""
