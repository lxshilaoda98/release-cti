###############################################################################
# deploy.conf — 集中配置文件
#
# 修改这里的值，然后执行 update-config.sh 会自动同步到所有服务配置文件
#
# 影响的配置文件:
#   cti/appsettings.json          autotask/appsettings.json
#   goapi/config.json             getcurl/config.yml
#   luahelper/config.yml          fs/.../event_socket.conf.xml
#   fs/conf/vars.xml + sip_profiles (VIP 非空时)
#   docker-compose.yml (redis 密码)
#
###############################################################################

